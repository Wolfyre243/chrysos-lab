[project]
name = "chrysos-lab"
version = "0.1.0"
description = "Testing grounds for prototype Chrysos calculators, indicators and screeners."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "yfinance>=1.7.0",
]

[project.scripts]
calendar-iv-crush = "cli.calendar_iv_crush:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = ["src/notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
